[package]
name = "examples"
version = "0.0.0"
publish = false
edition = "2018"

[workspace]

[dev-dependencies]
tokio = { version = "1.1.0", path = "../tokio", features = ["full"] }
tokio-util = { version = "0.6.2", path = "../tokio-util", features = ["full"] }
bytes = "0.5"
futures = "0.3.0"
http = "0.2"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
httparse = "1.0"
time = "0.1"
copy_in_place = "0.2.1"
tini = "0.2.0"
rust-ini = "0.14.0"
log = { version = "^0.4.5", features = ["std"] }
simple_logger="1.6.0"
simplelog = "^0.7.4"
console="0.10.0"
log4rs={ version = "0.11.0", default = ["all_components", "file", "yaml_format"]}

mio="0.7.7"
env_logger = { version = "0.6.2", default-features = false }
rand = "0.4"

[dependencies]
log = "0.4.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.82"

[target.'cfg(windows)'.dependencies]
miow   = "0.3.6"
winapi = { version = "0.3", features = ["winsock2", "mswsock"] }
ntapi  = "0.3"

[[example]]
name = "chat"
path = "chat.rs"

[[example]]
name = "connect"
path = "connect.rs"

[[example]]
name = "echo-udp"
path = "echo-udp.rs"

[[example]]
name = "echo"
path = "echo.rs"

[[example]]
name = "hello_world"
path = "hello_world.rs"

[[example]]
name = "print_each_packet"
path = "print_each_packet.rs"

[[example]]
name = "proxy"
path = "proxy.rs"

[[example]]
name = "tinydb"
path = "tinydb.rs"

[[example]]
name = "udp-client"
path = "udp-client.rs"

[[example]]
name = "udp-codec"
path = "udp-codec.rs"

[[example]]
name = "tinyhttp"
path = "tinyhttp.rs"


[[example]]
name = "net_server"
path = "net_server.rs"

[[example]]
name = "center_server"
path = "center_server.rs"

[[example]]
name = "gate_server"
path = "gate_server.rs"

[[example]]
name = "gate_server_packet_vec"
path = "gate_server_packet_vec.rs"

[[example]]
name = "gate_server_packet_bytes"
path = "gate_server_packet_bytes.rs"

[[example]]
name = "mio_server"
path = "mio_server.rs"